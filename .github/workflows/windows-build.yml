name: Windows build

on:
  push:
    branches: [main, "dev/**"]

concurrency:
  group: solyan-v022-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Build release CLI
        run: cargo build --release -p solyan-airplay

      - name: Build release GUI
        run: cargo build --release -p solyan-airplay-gui

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: SolYan-AirPlay2-v0.2.2-Windows
          path: target/release/SolYan-AirPlay2.exe

      - name: Upload debug CLI
        uses: actions/upload-artifact@v4
        with:
          name: SolYan-AirPlay2-v0.2.2-Debug-Tools
          path: target/release/solyan-airplay.exe
