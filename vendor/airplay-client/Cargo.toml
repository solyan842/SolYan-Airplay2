[package]
name = "airplay-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "High-level AirPlay 2 sender client (SolYan stability patch)"

[dependencies]
airplay-core = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-discovery = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-crypto = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-pairing = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-rtsp = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-audio = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-timing = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
