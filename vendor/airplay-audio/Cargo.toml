[package]
name = "airplay-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "Vendored AirPlay 2 audio/RTP crate with SolYan Windows portability patch"

[dependencies]
airplay-core = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-crypto = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-timing = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
airplay-resampler = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }

tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
symphonia = { version = "0.5", features = ["all"] }
tracing = "0.1"
socket2 = "0.5"
rand = "0.8"
crossbeam-channel = "0.5"
libc = "0.2"
spin_sleep = "1.2"
alac-encoder = "0.3"
fdk-aac = "0.6"
biquad = "0.4"
rustfft = "6"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
test-case = "3.3"
proptest = "1.4"
hound = "3.5"
