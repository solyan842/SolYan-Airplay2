[package]
name = "airplay-timing"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/lmcgartland/airplay2-rs"
description = "PTP and NTP timing synchronization for AirPlay 2 (SolYan stability patch)"

[dependencies]
airplay-core = { git = "https://github.com/lmcgartland/airplay2-rs", rev = "a2f980cf25bf13ae20158497cc2d2ea69cd88fa7" }
tokio = { version = "1.37", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
socket2 = "0.5"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
test-case = "3.3"
